<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Firebase Realtime Database CDN (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  </head>
  <body class="bg-[#F8F9FA] text-[#0F172A] antialiased select-none overscroll-none">
    <div id="root"></div>

    <!-- Zero-Latency Firebase Realtime Database Sync Engine -->
    <script>
      (function() {
        // 1. Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyBjTY6_nZuJiATOkcSJDtlwQVpjO54-QRE",
          authDomain: "enrichsalonpos.firebaseapp.com",
          databaseURL: "https://enrichsalonpos-default-rtdb.firebaseio.com",
          projectId: "enrichsalonpos",
          storageBucket: "enrichsalonpos.firebasestorage.app",
          messagingSenderId: "1053074205412",
          appId: "1:1053074205412:web:75be1f395ca03e92a19af1"
        };

        let app = null;
        let db = null;
        try {
          if (window.firebase) {
            if (!window.firebase.apps.length) {
              app = window.firebase.initializeApp(firebaseConfig);
            } else {
              app = window.firebase.app();
            }
            db = window.firebase.database();
            // Maintain immediate active online WebSocket channel
            db.goOnline();
            console.log('[Firebase RTDB] Connected with active WebSocket:', firebaseConfig.databaseURL);
          }
        } catch (err) {
          console.error('[Firebase RTDB] Init error:', err);
        }

        // Sanitization helper for RTDB keys (keys cannot contain: . # $ [ ] /)
        function toFirebaseKey(key) {
          if (!key) return 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
          return String(key).replace(/[.#$[\]/]/g, function(c) {
            return '_' + c.charCodeAt(0).toString(16) + '_';
          });
        }

        // Offline Queue & Failsafe Storage
        const OFFLINE_QUEUE_KEY = 'enreach_offline_sync_queue_v2';
        function getOfflineQueue() {
          try {
            const raw = localStorage.getItem(OFFLINE_QUEUE_KEY);
            return raw ? JSON.parse(raw) : [];
          } catch (e) {
            return [];
          }
        }

        function addToOfflineQueue(item) {
          try {
            const q = getOfflineQueue();
            const idx = q.findIndex(function(x) { return x.type === item.type && x.id === item.id; });
            if (idx >= 0) q[idx] = item;
            else q.push(item);
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
          } catch (e) {}
        }

        function removeFromOfflineQueue(type, id) {
          try {
            const q = getOfflineQueue().filter(function(x) {
              return !(x.type === type && x.id === id);
            });
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
          } catch (e) {}
        }

        // Fast in-memory mirrors
        window.__salonLastFirebaseOrders = [];
        window.__salonLastFirebaseMembers = [];
        window.__salonLastFirebaseLoyaltyPasses = [];
        window.__salonLastFirebaseStaff = [];
        window.__salonLastFirebaseServices = [];
        window.__salonLastFirebaseCategories = [];

        // Pre-load cached loyalty passes from localStorage if available
        try {
          const cachedPasses = localStorage.getItem('backstage_loyalty_passes');
          if (cachedPasses) {
            window.__salonLastFirebaseLoyaltyPasses = JSON.parse(cachedPasses);
          }
        } catch(e) {}

        // Global Salon Firebase Bridge for Instant Sync
        window.salonFirebase = {
          app: app,
          db: db,
          isInitialized: Boolean(db),
          toFirebaseKey: toFirebaseKey,

          // 1. INSTANT PUSH ON FINALIZE BILL: Executes .set() immediately
          syncOrder: function(order) {
            if (!order || !order.id) return Promise.resolve();
            const key = toFirebaseKey(order.id);

            // Sanitize order & ensure item-level staff ID and Name are explicitly preserved
            var cleanOrder;
            try {
              cleanOrder = JSON.parse(JSON.stringify(order));
            } catch(e) {
              cleanOrder = Object.assign({}, order);
            }

            if (Array.isArray(cleanOrder.items)) {
              cleanOrder.items = cleanOrder.items.map(function(item) {
                var sName = item.stylistName || cleanOrder.staffName || 'Kunal';
                var sId = item.stylistId || ('staff-' + sName.toLowerCase().replace(/\s+/g, '-'));
                return {
                  service: item.service,
                  quantity: item.quantity || 1,
                  stylistId: sId,
                  stylistName: sName
                };
              });
            }

            // a. Immediately update local in-memory mirror and cache
            let found = false;
            for (let i = 0; i < window.__salonLastFirebaseOrders.length; i++) {
              if (window.__salonLastFirebaseOrders[i].id === cleanOrder.id) {
                window.__salonLastFirebaseOrders[i] = cleanOrder;
                found = true;
                break;
              }
            }
            if (!found) {
              window.__salonLastFirebaseOrders.unshift(cleanOrder);
            }
            try {
              localStorage.setItem('backstage_orders', JSON.stringify(window.__salonLastFirebaseOrders));
            } catch (e) {}

            // b. Queue locally first as absolute failsafe
            addToOfflineQueue({ type: 'order', id: cleanOrder.id, data: cleanOrder, timestamp: Date.now() });

            // c. Instant WebSocket push to Firebase Realtime Database
            if (!db) return Promise.resolve();

            // Set priority high / execute set immediately
            const ref = db.ref('orders/' + key);
            const pushPromise = ref.set(cleanOrder);

            pushPromise.then(function() {
              removeFromOfflineQueue('order', cleanOrder.id);
              console.log('[Firebase RTDB] Instant push success for order:', cleanOrder.id);
            }).catch(function(err) {
              console.warn('[Firebase RTDB] Write pending (offline queue active):', err);
            });

            return pushPromise;
          },

          // Push membership instantly
          syncMembership: function(member) {
            if (!member) return Promise.resolve();
            const id = member.id || member.clientPhone;
            const key = toFirebaseKey(id);

            // Local mirror
            let found = false;
            for (let i = 0; i < window.__salonLastFirebaseMembers.length; i++) {
              if (window.__salonLastFirebaseMembers[i].id === member.id || window.__salonLastFirebaseMembers[i].clientPhone === member.clientPhone) {
                window.__salonLastFirebaseMembers[i] = member;
                found = true;
                break;
              }
            }
            if (!found) {
              window.__salonLastFirebaseMembers.unshift(member);
            }
            try {
              localStorage.setItem('backstage_memberships', JSON.stringify(window.__salonLastFirebaseMembers));
            } catch (e) {}

            addToOfflineQueue({ type: 'membership', id: id, data: member, timestamp: Date.now() });

            if (!db) return Promise.resolve();
            const ref = db.ref('memberships/' + key);
            const promise = ref.set(member);
            promise.then(function() {
              removeFromOfflineQueue('membership', id);
            }).catch(function() {});

            return promise;
          },

          // Push loyalty member pass instantly to Firebase Realtime Database under loyalty_passes node
          syncLoyaltyPass: function(pass) {
            if (!pass) return Promise.resolve();
            const id = pass.id || pass.clientPhone;
            const key = toFirebaseKey(id);

            // Fast local mirror update
            let found = false;
            for (let i = 0; i < window.__salonLastFirebaseLoyaltyPasses.length; i++) {
              if (window.__salonLastFirebaseLoyaltyPasses[i].id === pass.id) {
                window.__salonLastFirebaseLoyaltyPasses[i] = pass;
                found = true;
                break;
              }
            }
            if (!found) {
              window.__salonLastFirebaseLoyaltyPasses.unshift(pass);
            }
            try {
              localStorage.setItem('backstage_loyalty_passes', JSON.stringify(window.__salonLastFirebaseLoyaltyPasses));
            } catch (e) {}

            addToOfflineQueue({ type: 'loyalty_pass', id: id, data: pass, timestamp: Date.now() });

            if (!db) return Promise.resolve();
            const ref = db.ref('loyalty_passes/' + key);
            const promise = ref.set(pass);
            promise.then(function() {
              removeFromOfflineQueue('loyalty_pass', id);
              console.log('[Firebase RTDB] Instant push success for loyalty_passes:', id);
            }).catch(function(err) {
              console.warn('[Firebase RTDB] loyalty pass write pending:', err);
            });

            return promise;
          },

          // Push staff members list
          syncStaffMembers: function(staffList) {
            if (!Array.isArray(staffList)) return Promise.resolve();
            window.__salonLastFirebaseStaff = staffList;
            try {
              localStorage.setItem('backstage_staff_performance', JSON.stringify(staffList));
            } catch (e) {}

            if (!db) return Promise.resolve();
            const updates = {};
            staffList.forEach(function(s) {
              if (s && (s.id || s.name)) {
                updates['staff_members/' + toFirebaseKey(s.id || s.name)] = s;
              }
            });
            return db.ref().update(updates).catch(function(err) {
              console.warn('[Firebase RTDB] staff sync warning:', err);
            });
          },

          // Push individual service record
          syncStaffServiceRecord: function(staffName, record) {
            if (!db || !staffName || !record) return Promise.resolve();
            const key = toFirebaseKey(record.id);
            return db.ref('staff_services/' + key).set({
              staffName: staffName,
              record: record,
              timestamp: Date.now()
            }).catch(function() {});
          },

          resetOrders: function() {
            if (!db) return Promise.resolve();
            return db.ref('orders').remove().catch(function(err) {
              console.warn('[Firebase RTDB] resetOrders error:', err);
            });
          },

          syncServices: function(servicesList) {
            if (!Array.isArray(servicesList)) return Promise.resolve();
            window.__salonLastFirebaseServices = servicesList;
            try {
              localStorage.setItem('backstage_services', JSON.stringify(servicesList));
            } catch (e) {}

            if (!db) return Promise.resolve();
            const updates = {};
            servicesList.forEach(function(s) {
              if (s && s.id) {
                updates[toFirebaseKey(s.id)] = s;
              }
            });
            return db.ref('services').set(updates).catch(function(err) {
              console.warn('[Firebase RTDB] services sync warning:', err);
            });
          },

          syncServiceItem: function(service) {
            if (!service || !service.id) return Promise.resolve();
            const key = toFirebaseKey(service.id);
            let found = false;
            for (let i = 0; i < window.__salonLastFirebaseServices.length; i++) {
              if (window.__salonLastFirebaseServices[i].id === service.id) {
                window.__salonLastFirebaseServices[i] = service;
                found = true;
                break;
              }
            }
            if (!found) {
              window.__salonLastFirebaseServices.push(service);
            }
            try {
              localStorage.setItem('backstage_services', JSON.stringify(window.__salonLastFirebaseServices));
            } catch (e) {}

            if (!db) return Promise.resolve();
            return db.ref('services/' + key).set(service).catch(function(err) {
              console.warn('[Firebase RTDB] service item sync warning:', err);
            });
          },

          deleteServiceItem: function(serviceId) {
            if (!serviceId) return Promise.resolve();
            window.__salonLastFirebaseServices = window.__salonLastFirebaseServices.filter(function(s) {
              return s.id !== serviceId;
            });
            try {
              localStorage.setItem('backstage_services', JSON.stringify(window.__salonLastFirebaseServices));
            } catch (e) {}

            if (!db) return Promise.resolve();
            return db.ref('services/' + toFirebaseKey(serviceId)).remove().catch(function(err) {
              console.warn('[Firebase RTDB] service delete warning:', err);
            });
          },

          syncCategories: function(categoriesList) {
            if (!Array.isArray(categoriesList)) return Promise.resolve();
            window.__salonLastFirebaseCategories = categoriesList;
            try {
              localStorage.setItem('backstage_service_categories', JSON.stringify(categoriesList));
            } catch (e) {}
            if (!db) return Promise.resolve();
            return db.ref('service_categories').set(categoriesList).catch(function(err) {
              console.warn('[Firebase RTDB] categories sync warning:', err);
            });
          },

          getOrders: function() {
            return window.__salonLastFirebaseOrders || [];
          },
          getMemberships: function() {
            return window.__salonLastFirebaseMembers || [];
          },
          getLoyaltyPasses: function() {
            return window.__salonLastFirebaseLoyaltyPasses || [];
          },
          getStaff: function() {
            return window.__salonLastFirebaseStaff || [];
          },
          getServices: function() {
            return window.__salonLastFirebaseServices || [];
          },
          getCategories: function() {
            return window.__salonLastFirebaseCategories || [];
          },
          flushQueue: function() {
            flushOfflineQueue();
          }
        };

        if (!db) return;

        // 2. Persistent Realtime WebSocket Listeners
        const ordersRef = db.ref('orders');
        const membersRef = db.ref('memberships');
        const loyaltyPassesRef = db.ref('loyalty_passes');
        const staffRef = db.ref('staff_members');
        const servicesRef = db.ref('services');
        const categoriesRef = db.ref('service_categories');

        try {
          // Keep active socket pipe open and synchronized
          ordersRef.keepSynced(true);
          membersRef.keepSynced(true);
          loyaltyPassesRef.keepSynced(true);
          staffRef.keepSynced(true);
          servicesRef.keepSynced(true);
          categoriesRef.keepSynced(true);
        } catch (e) {}

        // A. Real-time child_added on Orders: Triggers INSTANTLY when ANY device creates an order
        ordersRef.on('child_added', function(snapshot) {
          const newOrder = snapshot.val();
          if (!newOrder || !newOrder.id) return;

          let exists = false;
          for (let i = 0; i < window.__salonLastFirebaseOrders.length; i++) {
            if (window.__salonLastFirebaseOrders[i].id === newOrder.id) {
              exists = true;
              break;
            }
          }

          if (!exists) {
            window.__salonLastFirebaseOrders.unshift(newOrder);
            // Dispatch high-priority custom events so React updates state in <1 second
            window.dispatchEvent(new CustomEvent('salon:firebase-order-added', { detail: newOrder }));
            window.dispatchEvent(new CustomEvent('salon:firebase-orders-updated', { detail: window.__salonLastFirebaseOrders }));

            try {
              localStorage.setItem('backstage_orders', JSON.stringify(window.__salonLastFirebaseOrders));
            } catch (e) {}
          }
        }, function(err) {
          console.warn('[Firebase RTDB] child_added orders error:', err);
        });

        // B. Real-time child_changed on Orders
        ordersRef.on('child_changed', function(snapshot) {
          const updatedOrder = snapshot.val();
          if (!updatedOrder || !updatedOrder.id) return;

          for (let i = 0; i < window.__salonLastFirebaseOrders.length; i++) {
            if (window.__salonLastFirebaseOrders[i].id === updatedOrder.id) {
              window.__salonLastFirebaseOrders[i] = updatedOrder;
              break;
            }
          }
          window.dispatchEvent(new CustomEvent('salon:firebase-orders-updated', { detail: window.__salonLastFirebaseOrders }));
        });

        // C. Full value synchronization on Orders
        ordersRef.on('value', function(snapshot) {
          const val = snapshot.val();
          const list = [];
          if (val) {
            Object.keys(val).forEach(function(k) {
              if (val[k]) list.push(val[k]);
            });
          }
          window.__salonLastFirebaseOrders = list;
          window.dispatchEvent(new CustomEvent('salon:firebase-orders-updated', { detail: list }));

          if (list.length > 0) {
            try {
              localStorage.setItem('backstage_orders', JSON.stringify(list));
            } catch (e) {}
          }
        }, function(err) {
          console.warn('[Firebase RTDB] orders value error:', err);
        });

        // D. Memberships Listeners
        membersRef.on('child_added', function(snapshot) {
          const member = snapshot.val();
          if (!member) return;
          const exists = window.__salonLastFirebaseMembers.some(function(m) {
            return m.id === member.id || m.clientPhone === member.clientPhone;
          });
          if (!exists) {
            window.__salonLastFirebaseMembers.unshift(member);
            window.dispatchEvent(new CustomEvent('salon:firebase-memberships-updated', { detail: window.__salonLastFirebaseMembers }));
            try {
              localStorage.setItem('backstage_memberships', JSON.stringify(window.__salonLastFirebaseMembers));
            } catch (e) {}
          }
        });

        membersRef.on('value', function(snapshot) {
          const val = snapshot.val();
          const list = [];
          if (val) {
            Object.keys(val).forEach(function(k) {
              if (val[k]) list.push(val[k]);
            });
          }
          window.__salonLastFirebaseMembers = list;
          window.dispatchEvent(new CustomEvent('salon:firebase-memberships-updated', { detail: list }));
          if (list.length > 0) {
            try {
              localStorage.setItem('backstage_memberships', JSON.stringify(list));
            } catch (e) {}
          }
        });

        // D2. Loyalty Passes Listeners (Real-time sync across devices)
        loyaltyPassesRef.on('child_added', function(snapshot) {
          const pass = snapshot.val();
          if (!pass || !pass.id) return;
          const exists = window.__salonLastFirebaseLoyaltyPasses.some(function(p) {
            return p.id === pass.id;
          });
          if (!exists) {
            window.__salonLastFirebaseLoyaltyPasses.unshift(pass);
            window.dispatchEvent(new CustomEvent('salon:firebase-loyalty-passes-updated', { detail: window.__salonLastFirebaseLoyaltyPasses }));
            try {
              localStorage.setItem('backstage_loyalty_passes', JSON.stringify(window.__salonLastFirebaseLoyaltyPasses));
            } catch (e) {}
          }
        });

        loyaltyPassesRef.on('child_changed', function(snapshot) {
          const updatedPass = snapshot.val();
          if (!updatedPass || !updatedPass.id) return;
          for (let i = 0; i < window.__salonLastFirebaseLoyaltyPasses.length; i++) {
            if (window.__salonLastFirebaseLoyaltyPasses[i].id === updatedPass.id) {
              window.__salonLastFirebaseLoyaltyPasses[i] = updatedPass;
              break;
            }
          }
          window.dispatchEvent(new CustomEvent('salon:firebase-loyalty-passes-updated', { detail: window.__salonLastFirebaseLoyaltyPasses }));
          try {
            localStorage.setItem('backstage_loyalty_passes', JSON.stringify(window.__salonLastFirebaseLoyaltyPasses));
          } catch (e) {}
        });

        loyaltyPassesRef.on('value', function(snapshot) {
          const val = snapshot.val();
          const list = [];
          if (val) {
            Object.keys(val).forEach(function(k) {
              if (val[k]) list.push(val[k]);
            });
          }
          window.__salonLastFirebaseLoyaltyPasses = list;
          window.dispatchEvent(new CustomEvent('salon:firebase-loyalty-passes-updated', { detail: list }));
          if (list.length > 0) {
            try {
              localStorage.setItem('backstage_loyalty_passes', JSON.stringify(list));
            } catch (e) {}
          }
        });

        // E. Staff Listeners
        staffRef.on('value', function(snapshot) {
          const val = snapshot.val();
          const list = [];
          if (val) {
            Object.keys(val).forEach(function(k) {
              if (val[k]) {
                const s = val[k];
                if (!Array.isArray(s.history)) {
                  s.history = s.history ? Object.values(s.history) : [];
                }
                list.push(s);
              }
            });
          }
          window.__salonLastFirebaseStaff = list;
          window.dispatchEvent(new CustomEvent('salon:firebase-staff-updated', { detail: list }));
          if (list.length > 0) {
            try {
              localStorage.setItem('backstage_staff_performance', JSON.stringify(list));
            } catch (e) {}
          }
        });

        // F. Services & Categories Listeners for multi-device realtime sync
        servicesRef.on('value', function(snapshot) {
          const val = snapshot.val();
          const list = [];
          if (val) {
            Object.keys(val).forEach(function(k) {
              if (val[k] && val[k].id) list.push(val[k]);
            });
          }
          if (list.length > 0) {
            window.__salonLastFirebaseServices = list;
            window.dispatchEvent(new CustomEvent('salon:firebase-services-updated', { detail: list }));
            try {
              localStorage.setItem('backstage_services', JSON.stringify(list));
            } catch (e) {}
          }
        }, function(err) {
          console.warn('[Firebase RTDB] services value error:', err);
        });

        categoriesRef.on('value', function(snapshot) {
          const val = snapshot.val();
          if (Array.isArray(val) && val.length > 0) {
            window.__salonLastFirebaseCategories = val;
            window.dispatchEvent(new CustomEvent('salon:firebase-categories-updated', { detail: val }));
            try {
              localStorage.setItem('backstage_service_categories', JSON.stringify(val));
            } catch (e) {}
          }
        });

        // G. Connection & Auto-Reconnect
        db.ref('.info/connected').on('value', function(snap) {
          const isConnected = Boolean(snap.val());
          window.dispatchEvent(new CustomEvent('salon:firebase-connection', { detail: { connected: isConnected } }));
          if (isConnected) {
            flushOfflineQueue();
          }
        });

        // Flush offline queue when network reconnects or tab becomes visible
        function flushOfflineQueue() {
          if (!navigator.onLine || !db) return;
          const q = getOfflineQueue();
          if (!q.length) return;
          console.log('[Firebase RTDB] Flushing ' + q.length + ' queued items to cloud...');

          q.forEach(function(item) {
            if (item.type === 'order' && item.data) {
              const k = toFirebaseKey(item.id);
              db.ref('orders/' + k).set(item.data).then(function() {
                removeFromOfflineQueue('order', item.id);
              }).catch(function() {});
            } else if (item.type === 'membership' && item.data) {
              const k = toFirebaseKey(item.id);
              db.ref('memberships/' + k).set(item.data).then(function() {
                removeFromOfflineQueue('membership', item.id);
              }).catch(function() {});
            } else if (item.type === 'loyalty_pass' && item.data) {
              const k = toFirebaseKey(item.id);
              db.ref('loyalty_passes/' + k).set(item.data).then(function() {
                removeFromOfflineQueue('loyalty_pass', item.id);
              }).catch(function() {});
            }
          });
        }

        window.addEventListener('online', function() {
          if (db) db.goOnline();
          flushOfflineQueue();
        });

        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible' && db) {
            db.goOnline();
            flushOfflineQueue();
          }
        });

        // 3. Auto-Migration & Non-Destructive Data Safety
        function runAutoMigration() {
          try {
            const candidateKeys = ['backstage_orders', 'sales_history', 'invoices', 'backstage_cloud_orders'];
            const allLocalOrders = [];
            const seenIds = new Set();

            candidateKeys.forEach(function(key) {
              try {
                const raw = localStorage.getItem(key);
                if (raw) {
                  const parsed = JSON.parse(raw);
                  if (Array.isArray(parsed)) {
                    parsed.forEach(function(o) {
                      if (o && o.id && !seenIds.has(o.id)) {
                        seenIds.add(o.id);
                        allLocalOrders.push(o);
                      }
                    });
                  }
                }
              } catch (e) {}
            });

            if (allLocalOrders.length > 0) {
              ordersRef.once('value').then(function(snapshot) {
                const existing = snapshot.val() || {};
                const existingKeys = new Set(Object.keys(existing));
                const updates = {};
                let count = 0;

                allLocalOrders.forEach(function(ord) {
                  const k = toFirebaseKey(ord.id);
                  if (!existingKeys.has(k)) {
                    updates[k] = ord;
                    count++;
                  }
                });

                if (count > 0) {
                  ordersRef.update(updates).then(function() {
                    console.log('[Firebase RTDB] Auto-migration: Synced ' + count + ' orders to cloud.');
                  });
                }
              }).catch(function() {});
            }
          } catch (e) {}
        }

        // Run non-destructive migration on start
        setTimeout(runAutoMigration, 300);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Service worker management: prevent stale React module caching in preview/dev, allow clean standalone PWA in production
      if ('serviceWorker' in navigator) {
        const isPreviewOrDev =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname.includes('.run.app') ||
          location.port === '3000';

        if (isPreviewOrDev) {
          // Clean up any stale service workers or caches that could cause duplicate React runtime instances
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let reg of registrations) {
              reg.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) {
                if (name.includes('enreach-salon-pos-v1') || name.includes('enreach-salon-pos-v2')) {
                  caches.delete(name);
                }
              }
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/service-worker.js').catch(function() {});
          });
        }
      }
    </script>
