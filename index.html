<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Enreach Unisex Salon - POS &amp; Staff Performance</title>
    <meta name="description" content="Point of sale, billing terminal, and cloud sales history for Enreach Unisex Salon." />
    <meta property="og:title" content="Enreach Unisex Salon - POS &amp; Staff Performance" />
    <meta property="og:description" content="Point of sale, billing terminal, and cloud sales history for Enreach Unisex Salon." />
    <meta property="og:type" content="website" />

    <!-- Web Application Manifest & PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#B45309" />
    <meta name="background-color" content="#0F172A" />

    <!-- Mobile Standalone (Android, Chrome, iOS Safari) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Official Salon Favicons & App Icons (points directly to /salon-logo.jpg) -->
    <link rel="icon" type="image/jpeg" href="/salon-logo.jpg" />
    <link rel="shortcut icon" href="/salon-logo.jpg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/salon-logo.jpg" />
    <link rel="apple-touch-icon" href="/salon-logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Firebase Realtime Database CDN (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  </head>
  <body class="bg-[#F8F9FA] text-[#0F172A] antialiased select-none overscroll-none">
    <div id="root"></div>

    <!-- Zero-Latency Firebase Realtime Database Sync Engine -->
    <script>
      (function() {
        // 1. Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyBjTY6_nZuJiATOkcSJDtlwQVpjO54-QRE",
          authDomain: "enrichsalonpos.firebaseapp.com",
          databaseURL: "https://enrichsalonpos-default-rtdb.firebaseio.com",
          projectId: "enrichsalonpos",
          storageBucket: "enrichsalonpos.firebasestorage.app",
          messagingSenderId: "1053074205412",
          appId: "1:1053074205412:web:75be1f395ca03e92a19af1"
        };

        let app = null;
        let db = null;
        try {
          if (window.firebase) {
            if (!window.firebase.apps.length) {
              app = window.firebase.initializeApp(firebaseConfig);
            } else {
              app = window.firebase.app();
            }
            db = window.firebase.database();
            // Maintain immediate active online WebSocket channel
            db.goOnline();
            console.log('[Firebase RTDB] Connected with active WebSocket:', firebaseConfig.databaseURL);
          }
        } catch (err) {
          console.error('[Firebase RTDB] Init error:', err);
        }

        // Sanitization helper for RTDB keys (keys cannot contain: . # $ [ ] /)
        function toFirebaseKey(key) {
          if (!key) return 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
          return String(key).replace(/[.#$[\]/]/g, function(c) {
            return '_' + c.charCodeAt(0).toString(16) + '_';
          });
        }

        // Offline Queue & Failsafe Storage
        const OFFLINE_QUEUE_KEY = 'enreach_offline_sync_queue_v2';
        function getOfflineQueue() {
          try {
            const raw = localStorage.getItem(OFFLINE_QUEUE_KEY);
            return raw ? JSON.parse(raw) : [];
          } catch (e) {
            return [];
          }
        }

        function addToOfflineQueue(item) {
          try {
            const q = getOfflineQueue();
            const idx = q.findIndex(function(x) { return x.type === item.type && x.id === item.id; });
            if (idx >= 0) q[idx] = item;
            else q.push(item);
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
          } catch (e) {}
        }

        function removeFromOfflineQueue(type, id) {
          try {
            const q = getOfflineQueue().filter(function(x) {
              return !(x.type === type && x.id === id);
            });
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
          } catch (e) {}
        }

        // Fast in-memory mirrors
        window.__salonLastFirebaseOrders = [];
        window.__salonLastFirebaseMembers = [];
        window.__salonLastFirebaseStaff = [];

        // Global Salon Firebase Bridge for Instant Sync
        window.salonFirebase = {
          app: app,
          db: db,
          isInitialized: Boolean(db),
          toFirebaseKey: toFirebaseKey,

          // 1. INSTANT PUSH ON FINALIZE BILL: Executes .set() immediately
          syncOrder: function(order) {
            if (!order || !order.id) return Promise.resolve();
            const key = toFirebaseKey(order.id);

            // a. Immediately update local in-memory mirror and cache
            let found = false;
            for (let i = 0; i < window.__salonLastFirebaseOrders.length; i++) {
              if (window.__salonLastFirebaseOrders[i].id === order.id) {
                window.__salonLastFirebaseOrders[i] = order;
                found = true;
                break;
              }
            }
            if (!found) {
              window.__salonLastFirebaseOrders.unshift(order);
            }
            try {
              localStorage.setItem('backstage_orders', JSON.stringify(window.__salonLastFirebaseOrders));
            } catch (e) {}

            // b. Queue locally first as absolute failsafe
            addToOfflineQueue({ type: 'order', id: order.id, data: order, timestamp: Date.now() });

            // c. Instant WebSocket push to Firebase Realtime Database
            if (!db) return Promise.resolve();

            // Set priority high / execute set immediately
            const ref = db.ref('orders/' + key);
            const pushPromise = ref.set(order);

            pushPromise.then(function() {
              removeFromOfflineQueue('order', order.id);
              console.log('[Firebase RTDB] Instant push success for order:', order.id);
            }).catch(function(err) {
              console.warn('[Firebase RTDB] Write pending (offline queue active):', err);
            });

            return pushPromise;
          },

          // Push membership instantly
          syncMembership: function(member) {
            if (!member) return Promise.resolve();
            const id = member.id || member.clientPhone;
            const key = toFirebaseKey(id);

            // Local mirror
            let found = false;
            for (let i = 0; i < window.__salonLastFirebaseMembers.length; i++) {
              if (window.__salonLastFirebaseMembers[i].id === member.id || window.__salonLastFirebaseMembers[i].clientPhone === member.clientPhone) {
                window.__salonLastFirebaseMembers[i] = member;
                found = true;
                break;
              }
            }
            if (!found) {
              window.__salonLastFirebaseMembers.unshift(member);
            }
            try {
              localStorage.setItem('backstage_memberships', JSON.stringify(window.__salonLastFirebaseMembers));
            } catch (e) {}

            addToOfflineQueue({ type: 'membership', id: id, data: member, timestamp: Date.now() });

            if (!db) return Promise.resolve();
            const ref = db.ref('memberships/' + key);
            const promise = ref.set(member);
            promise.then(function() {
              removeFromOfflineQueue('membership', id);
            }).catch(function() {});

            return promise;
          },

          // Push staff members list
          syncStaffMembers: function(staffList) {
            if (!Array.isArray(staffList)) return Promise.resolve();
            window.__salonLastFirebaseStaff = staffList;
            try {
              localStorage.setItem('backstage_staff_performance', JSON.stringify(staffList));
            } catch (e) {}

            if (!db) return Promise.resolve();
            const updates = {};
            staffList.forEach(function(s) {
              if (s && (s.id || s.name)) {
                updates['staff_members/' + toFirebaseKey(s.id || s.name)] = s;
              }
            });
            return db.ref().update(updates).catch(function(err) {
              console.warn('[Firebase RTDB] staff sync warning:', err);
            });
          },

          // Push individual service record
          syncStaffServiceRecord: function(staffName, record) {
            if (!db || !staffName || !record) return Promise.resolve();
            const key = toFirebaseKey(record.id);
            return db.ref('staff_services/' + key).set({
              staffName: staffName,
              record: record,
              timestamp: Date.now()
            }).catch(function() {});
          },

          resetOrders: function() {
            if (!db) return Promise.resolve();
            return db.ref('orders').remove().catch(function(err) {
              console.warn('[Firebase RTDB] resetOrders error:', err);
            });
          },

          getOrders: function() {
            return window.__salonLastFirebaseOrders || [];
          },
          getMemberships: function() {
            return window.__salonLastFirebaseMembers || [];
          },
          getStaff: function() {
            return window.__salonLastFirebaseStaff || [];
          },
          flushQueue: function() {
            flushOfflineQueue();
          }
        };

        if (!db) return;

        // 2. Persistent Realtime WebSocket Listeners
        const ordersRef = db.ref('orders');
        const membersRef = db.ref('memberships');
        const staffRef = db.ref('staff_members');

        try {
          // Keep active socket pipe open and synchronized
          ordersRef.keepSynced(true);
          membersRef.keepSynced(true);
          staffRef.keepSynced(true);
        } catch (e) {}

        // A. Real-time child_added on Orders: Triggers INSTANTLY when ANY device creates an order
        ordersRef.on('child_added', function(snapshot) {
          const newOrder = snapshot.val();
          if (!newOrder || !newOrder.id) return;

          let exists = false;
          for (let i = 0; i < window.__salonLastFirebaseOrders.length; i++) {
            if (window.__salonLastFirebaseOrders[i].id === newOrder.id) {
              exists = true;
              break;
            }
          }

          if (!exists) {
            window.__salonLastFirebaseOrders.unshift(newOrder);
            // Dispatch high-priority custom events so React updates state in <1 second
            window.dispatchEvent(new CustomEvent('salon:firebase-order-added', { detail: newOrder }));
            window.dispatchEvent(new CustomEvent('salon:firebase-orders-updated', { detail: window.__salonLastFirebaseOrders }));

            try {
              localStorage.setItem('backstage_orders', JSON.stringify(window.__salonLastFirebaseOrders));
            } catch (e) {}
          }
        }, function(err) {
          console.warn('[Firebase RTDB] child_added orders error:', err);
        });

        // B. Real-time child_changed on Orders
        ordersRef.on('child_changed', function(snapshot) {
          const updatedOrder = snapshot.val();
          if (!updatedOrder || !updatedOrder.id) return;

          for (let i = 0; i < window.__salonLastFirebaseOrders.length; i++) {
            if (window.__salonLastFirebaseOrders[i].id === updatedOrder.id) {
              window.__salonLastFirebaseOrders[i] = updatedOrder;
              break;
            }
          }
          window.dispatchEvent(new CustomEvent('salon:firebase-orders-updated', { detail: window.__salonLastFirebaseOrders }));
        });

        // C. Full value synchronization on Orders
        ordersRef.on('value', function(snapshot) {
          const val = snapshot.val();
          const list = [];
          if (val) {
            Object.keys(val).forEach(function(k) {
              if (val[k]) list.push(val[k]);
            });
          }
          window.__salonLastFirebaseOrders = list;
          window.dispatchEvent(new CustomEvent('salon:firebase-orders-updated', { detail: list }));

          if (list.length > 0) {
            try {
              localStorage.setItem('backstage_orders', JSON.stringify(list));
            } catch (e) {}
          }
        }, function(err) {
          console.warn('[Firebase RTDB] orders value error:', err);
        });

        // D. Memberships Listeners
        membersRef.on('child_added', function(snapshot) {
          const member = snapshot.val();
          if (!member) return;
          const exists = window.__salonLastFirebaseMembers.some(function(m) {
            return m.id === member.id || m.clientPhone === member.clientPhone;
          });
          if (!exists) {
            window.__salonLastFirebaseMembers.unshift(member);
            window.dispatchEvent(new CustomEvent('salon:firebase-memberships-updated', { detail: window.__salonLastFirebaseMembers }));
            try {
              localStorage.setItem('backstage_memberships', JSON.stringify(window.__salonLastFirebaseMembers));
            } catch (e) {}
          }
        });

        membersRef.on('value', function(snapshot) {
          const val = snapshot.val();
          const list = [];
          if (val) {
            Object.keys(val).forEach(function(k) {
              if (val[k]) list.push(val[k]);
            });
          }
          window.__salonLastFirebaseMembers = list;
          window.dispatchEvent(new CustomEvent('salon:firebase-memberships-updated', { detail: list }));
          if (list.length > 0) {
            try {
              localStorage.setItem('backstage_memberships', JSON.stringify(list));
            } catch (e) {}
          }
        });

        // E. Staff Listeners
        staffRef.on('value', function(snapshot) {
          const val = snapshot.val();
          const list = [];
          if (val) {
            Object.keys(val).forEach(function(k) {
              if (val[k]) list.push(val[k]);
            });
          }
          window.__salonLastFirebaseStaff = list;
          window.dispatchEvent(new CustomEvent('salon:firebase-staff-updated', { detail: list }));
          if (list.length > 0) {
            try {
              localStorage.setItem('backstage_staff_performance', JSON.stringify(list));
            } catch (e) {}
          }
        });

        // F. Connection & Auto-Reconnect
        db.ref('.info/connected').on('value', function(snap) {
          const isConnected = Boolean(snap.val());
          window.dispatchEvent(new CustomEvent('salon:firebase-connection', { detail: { connected: isConnected } }));
          if (isConnected) {
            flushOfflineQueue();
          }
        });

        // Flush offline queue when network reconnects or tab becomes visible
        function flushOfflineQueue() {
          if (!navigator.onLine || !db) return;
          const q = getOfflineQueue();
          if (!q.length) return;
          console.log('[Firebase RTDB] Flushing ' + q.length + ' queued items to cloud...');

          q.forEach(function(item) {
            if (item.type === 'order' && item.data) {
              const k = toFirebaseKey(item.id);
              db.ref('orders/' + k).set(item.data).then(function() {
                removeFromOfflineQueue('order', item.id);
              }).catch(function() {});
            } else if (item.type === 'membership' && item.data) {
              const k = toFirebaseKey(item.id);
              db.ref('memberships/' + k).set(item.data).then(function() {
                removeFromOfflineQueue('membership', item.id);
              }).catch(function() {});
            }
          });
        }

        window.addEventListener('online', function() {
          if (db) db.goOnline();
          flushOfflineQueue();
        });

        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible' && db) {
            db.goOnline();
            flushOfflineQueue();
          }
        });

        // 3. Auto-Migration & Non-Destructive Data Safety
        function runAutoMigration() {
          try {
            const candidateKeys = ['backstage_orders', 'sales_history', 'invoices', 'backstage_cloud_orders'];
            const allLocalOrders = [];
            const seenIds = new Set();

            candidateKeys.forEach(function(key) {
              try {
                const raw = localStorage.getItem(key);
                if (raw) {
                  const parsed = JSON.parse(raw);
                  if (Array.isArray(parsed)) {
                    parsed.forEach(function(o) {
                      if (o && o.id && !seenIds.has(o.id)) {
                        seenIds.add(o.id);
                        allLocalOrders.push(o);
                      }
                    });
                  }
                }
              } catch (e) {}
            });

            if (allLocalOrders.length > 0) {
              ordersRef.once('value').then(function(snapshot) {
                const existing = snapshot.val() || {};
                const existingKeys = new Set(Object.keys(existing));
                const updates = {};
                let count = 0;

                allLocalOrders.forEach(function(ord) {
                  const k = toFirebaseKey(ord.id);
                  if (!existingKeys.has(k)) {
                    updates[k] = ord;
                    count++;
                  }
                });

                if (count > 0) {
                  ordersRef.update(updates).then(function() {
                    console.log('[Firebase RTDB] Auto-migration: Synced ' + count + ' orders to cloud.');
                  });
                }
              }).catch(function() {});
            }
          } catch (e) {}
        }

        // Run non-destructive migration on start
        setTimeout(runAutoMigration, 300);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Register service worker for standalone PWA installation
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(function(reg) {
            console.log('Enreach Salon ServiceWorker registered:', reg.scope);
          }).catch(function(err) {
            console.log('Enreach Salon ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
