<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner luxury border -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.5" />
  <circle cx="256" cy="256" r="175" fill="#0F172A" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Scissors & Styling Crest -->
  <g filter="url(#glow)">
    <!-- Scissor blade 1 -->
    <path d="M190 350 C165 350 145 330 145 305 C145 280 165 260 190 260 C205 260 218 267 226 278 L290 214 L340 160 C345 155 352 158 350 165 L320 220 L278 262 C289 270 296 283 296 298 C296 323 276 343 251 343 C236 343 223 336 215 325 L210 330 C205 342 198 350 190 350 Z" fill="url(#goldGrad)" opacity="0.95" />
    
    <!-- Scissor blade 2 -->
    <path d="M322 350 C347 350 367 330 367 305 C367 280 347 260 322 260 C307 260 294 267 286 278 L222 214 L172 160 C167 155 160 158 162 165 L192 220 L234 262 C223 270 216 283 216 298 C216 323 236 343 261 343 C276 343 289 336 297 325 L302 330 C307 342 314 350 322 350 Z" fill="url(#goldGrad)" opacity="0.95" />

    <!-- Center Pivot Pin -->
    <circle cx="256" cy="245" r="9" fill="#FDE68A" stroke="#92400E" stroke-width="2" />

    <!-- Stylized Crown / Star Accent -->
    <path d="M256 120 L262 136 L278 138 L266 149 L270 165 L256 157 L242 165 L246 149 L234 138 L250 136 Z" fill="#FDE68A" />
    <circle cx="200" cy="145" r="4" fill="#FDE68A" opacity="0.8" />
    <circle cx="312" cy="145" r="4" fill="#FDE68A" opacity="0.8" />
  </g>

  <!-- Typography / Brand Lettering -->
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    ENREACH
  </text>
  <text x="256" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="6" opacity="0.9">
    UNISEX SALON
  </text>
</svg>
